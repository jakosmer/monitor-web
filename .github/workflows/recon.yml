name: Reconocimiento

on:
  workflow_dispatch:
    inputs:
      pasos:
        description: 'Nombres de control, separados por coma'
        required: false
        default: ''

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb
      - name: Reconocer
        run: xvfb-run -a --server-args="-screen 0 1366x900x24" node recon.js
        env:
          PASOS: ${{ inputs.pasos }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: '*.png'
