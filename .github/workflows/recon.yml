name: Monitor citas

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-dian
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - run: npm install playwright
      - run: npx playwright install --with-deps chromium

      - name: Revisar disponibilidad
        id: check
        run: node check.js

      - name: Guardar captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estado-${{ github.run_number }}
          path: estado.png
          retention-days: 7
          if-no-files-found: ignore

      - name: HAY CITAS
        if: steps.check.outputs.estado == 'con_citas'
        env:
          GH_TOKEN: ${{ github.token }}
          YO: ${{ github.repository_owner }}
          D: ${{ steps.check.outputs.detalle }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HORA=$(TZ=America/Bogota date '+%d/%m %H:%M')
          NUM=$(gh issue list --state open --search "HAY CITAS in:title" \
                --json number --jq '.[0].number // empty')
          CUERPO="Detectado: $HORA (Bogota)

          Persona Natural / Videoatencion / Devoluciones

          Deteccion: $D

          Agendar: https://agendamiento.dian.gov.co/
          Captura: $RUN_URL"
          if [ -z "$NUM" ]; then
            gh issue create --title "🚨 HAY CITAS DIAN - Devoluciones" \
              --body "$CUERPO" --assignee "$YO"
          else
            gh issue comment "$NUM" --body "Sigue disponible ($HORA)"
          fi

      - name: Se restablecio
        if: steps.check.outputs.estado == 'sin_citas'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "monitor se rompio in:title" \
                --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "El flujo volvio a funcionar, cerrando."
          fi

      - name: Monitor roto
        if: steps.check.outputs.estado == 'roto'
        env:
          GH_TOKEN: ${{ github.token }}
          YO: ${{ github.repository_owner }}
          D: ${{ steps.check.outputs.detalle }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NUM=$(gh issue list --state open --search "monitor se rompio in:title" \
                --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            gh issue create --title "⚠️ El monitor se rompio" \
              --body "Motivo: $D

          Captura en $RUN_URL

          Probablemente cambiaron nombres de control o textos de opciones." \
              --assignee "$YO"
          fi

      - name: Backend lento
        if: steps.check.outputs.estado == 'lento'
        run: echo "El sitio no respondio a tiempo. Se reintenta en la proxima corrida."
